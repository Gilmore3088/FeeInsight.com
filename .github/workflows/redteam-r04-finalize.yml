name: Verify and deliver R04 checkout protection
on:
  push:
    branches: [redteam/r04-checkout-idempotency]
    paths: [.github/redteam/r04.patch.gz, .github/workflows/redteam-r04-finalize.yml]
permissions:
  contents: write
concurrency:
  group: redteam-r04-finalize
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'Gilmore3088/FeeInsight.com' && github.ref == 'refs/heads/redteam/r04-checkout-idempotency'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply the exact locally reviewed patch
        run: |
          set -euo pipefail
          echo '698b93ad3e89935a84a5863b7daf672d96fb0b16f85d106c165e0bba53770465  .github/redteam/r04.patch.gz' | sha256sum --check
          gzip -dc .github/redteam/r04.patch.gz > "$RUNNER_TEMP/r04.patch"
          echo "fb8134cea629e13fa0a64e0a4e26b8f782094a40aa6c29bb1a8351431b57917d  $RUNNER_TEMP/r04.patch" | sha256sum --check
          git apply --index "$RUNNER_TEMP/r04.patch"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run guard:legacy
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npx vitest run --maxWorkers=2
      - name: Test real checkout concurrency and migration permissions in disposable PostgreSQL
        env:
          BILLING_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/feeinsight_billing_test
        run: |
          set -euo pipefail
          sudo systemctl start postgresql.service
          sudo -u postgres psql -q -c "ALTER USER postgres PASSWORD 'postgres'"
          sudo -u postgres createdb feeinsight_billing_test
          npx vitest run src/lib/billing/checkout.integration.test.ts --maxWorkers=1
      - run: npm run build
      - name: Commit only the verified application tree to its existing branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'redteam/r04-checkout-idempotency'
          remote=$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)
          test "$remote" = "$GITHUB_SHA"
          git rm .github/redteam/r04.patch.gz .github/workflows/redteam-r04-finalize.yml
          test "$(git write-tree)" = 'e1bdd821e4be31b6af05ccfb31e26ffce18f0d45'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(checkout): persist purchase intents and prevent duplicate subscriptions (#983)'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          echo 'Exact reviewed tree delivered; temporary workflow removed. No production migration, live payment, or merge performed.' >> "$GITHUB_STEP_SUMMARY"
