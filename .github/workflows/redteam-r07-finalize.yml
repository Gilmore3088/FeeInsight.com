name: Finalize reviewed R07 import extraction
on:
  push:
    branches: [redteam/r07-import-cycles]
    paths: [.github/redteam/r07-apply.py, .github/workflows/redteam-r07-finalize.yml]
permissions:
  contents: write
concurrency:
  group: redteam-r07-finalize
  cancel-in-progress: false
jobs:
  apply-and-verify:
    if: github.repository == 'Gilmore3088/FeeInsight.com' && github.ref == 'refs/heads/redteam/r07-import-cycles'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply exact reviewed transformation
        run: python3 .github/redteam/r07-apply.py
      - name: Install without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify import and report behavior
        run: |
          npx vitest run src/lib/report-templates --maxWorkers=2
          npx tsc --noEmit
          npm run guard:legacy
          npx eslint src/lib/report-templates
      - name: Commit verified implementation to its existing branch only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'redteam/r07-import-cycles'
          remote=$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)
          test "$remote" = "$GITHUB_SHA"
          git add src/lib/report-templates
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor(reports): break template barrel cycle; preserve public API'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          echo 'Verified report-template implementation committed. No production release.' >> "$GITHUB_STEP_SUMMARY"
