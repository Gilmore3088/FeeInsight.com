name: backlog resolution evidence
on:
  pull_request:
    paths:
      - '.github/workflows/backlog-evidence.yml'
permissions:
  contents: read
  pull-requests: read
  actions: read
concurrency:
  group: backlog-evidence-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  evidence:
    if: github.event.pull_request.number == 987
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read baseline, current PRs and current branch incorporation
        env:
          GH_TOKEN: ${{ github.token }}
          BACKLOG_CUTOFF: '2026-10-09T18:04:00Z'
        run: |
          mkdir -p resolution-evidence/baseline
          gh api repos/Gilmore3088/FeeInsight.com/actions/artifacts/11645788072/zip > /tmp/baseline.zip
          echo '55272b9b8e06c50aba8162a0e8c27d009371f52441cf3323e8aac28694a7f0c6  /tmp/baseline.zip' | sha256sum -c -
          unzip -q /tmp/baseline.zip -d resolution-evidence/baseline
          gh api --paginate --slurp 'repos/Gilmore3088/FeeInsight.com/pulls?state=all&per_page=100' > resolution-evidence/all-prs.json
          node .github/scripts/backlog.mjs inventory
          cp -r backlog-output resolution-evidence/current
          cp -r .github/scripts resolution-evidence/setup-scripts
          cp .github/backlog-policy.json resolution-evidence/
          gh api repos/Gilmore3088/FeeInsight.com/actions/jobs/114036333032/logs > /tmp/app-test.log
          python - <<'PY'
          import re,pathlib
          lines=pathlib.Path('/tmp/app-test.log').read_text(errors='replace').splitlines()
          hits=set()
          for i,line in enumerate(lines):
            if re.search(r'FAIL |Failed Tests|AssertionError|Error:|Test Files|Tests\s+.*failed',line):
              hits.update(range(max(0,i-8),min(len(lines),i+30)))
          pathlib.Path('resolution-evidence/ci-failure-excerpt.txt').write_text('\n'.join(lines[i] for i in sorted(hits)))
          PY
      - name: Prepare exact-SHA candidate evidence and unique-work diffs (no remote writes)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,pathlib,subprocess,hashlib
          root=pathlib.Path('resolution-evidence')
          old=json.loads((root/'baseline/report.json').read_text())
          current=json.loads((root/'current/report.json').read_text())
          prs=[p for page in json.loads((root/'all-prs.json').read_text()) for p in page]
          now={b['name']:b for b in current['branches']}
          main=current['main_sha']
          def git(*args):return subprocess.check_output(['git',*args],text=True)
          def ancestor(a,b):return subprocess.run(['git','merge-base','--is-ancestor',a,b],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode==0
          protected={b['name'] for b in old['branches'] if b['disposition'] in ['protected_recent','protected_unknown_age','protected','parked_preserve']}
          selected=[];unique=[]
          for b in old['branches']:
            if b['disposition'] not in ['incorporated_candidate','investigate_unique_work']:continue
            c=now.get(b['name']);record={'branch':b['name'],'baseline_sha':b['sha'],'current_sha':c['sha'] if c else None,'owner':'ChatGPT — backlog coordinator','purpose':'Reconcile existing branch; no new feature scope','status':'preserve_pending_review'}
            if not c or c['sha']!=b['sha'] or b['name'] in protected or c['open_prs'] or c['dependent_prs'] or c['disposition'].startswith('protected') or c['disposition']=='parked_preserve':
              record['reason']='Missing, changed, active, dependent or protected';
              if b['disposition']=='investigate_unique_work':unique.append(record)
              continue
            matches=[p for p in prs if p.get('merged_at') and p['base']['ref']=='main' and p['head']['sha']==b['sha'] and p['head'].get('repo') and p['head']['repo']['full_name']=='Gilmore3088/FeeInsight.com' and p.get('merge_commit_sha') and ancestor(p['merge_commit_sha'],main)]
            direct=ancestor(b['sha'],main)
            record.update({'ancestor_of_main':direct,'exact_head_merged_prs':[{'number':p['number'],'merge_commit_sha':p['merge_commit_sha'],'head_branch':p['head']['ref']} for p in matches],'main_sha':main,'associated_prs':b['prs']})
            if b['disposition']=='incorporated_candidate':
              if len(selected)<10 and (direct or matches):selected.append(record)
            else:
              safe=b['name'].replace('/','__');folder=root/'unique'/safe;folder.mkdir(parents=True,exist_ok=True)
              (folder/'diff.patch').write_text(git('diff',f'{main}...{b["sha"]}'))
              (folder/'files.txt').write_text(git('diff','--name-status',f'{main}...{b["sha"]}'))
              (folder/'cherry.txt').write_text(git('cherry',main,b['sha']))
              (folder/'commits.txt').write_text(git('log','--format=%H %cI %s',f'{main}..{b["sha"]}'))
              record['evidence_path']=str(folder)
              unique.append(record)
          refs=[]
          for i,r in enumerate(selected):
            ref=f'refs/backlog-evidence/batch-01/{i+1:02d}'
            git('update-ref',ref,r['current_sha']) # LOCAL ephemeral runner ref only; no git push
            refs.append(ref);r['bundle_ref']=ref;r['proposed_action']='Delete remote branch only after exact-batch owner approval and execution-time recheck'
          if refs:
            subprocess.run(['git','bundle','create',str(root/'batch-01-recovery.bundle'),*refs],check=True)
            subprocess.run(['git','bundle','verify',str(root/'batch-01-recovery.bundle')],check=True)
          (root/'batch-01.json').write_text(json.dumps({'approved':False,'main_sha':main,'branches':selected},indent=2))
          (root/'unique-work.json').write_text(json.dumps(unique,indent=2))
          for n in [810,811,939,963,986,987]:
            p=next(p for p in prs if p['number']==n);folder=root/'prs'/str(n);folder.mkdir(parents=True,exist_ok=True)
            (folder/'metadata.json').write_text(json.dumps(p,indent=2))
            (folder/'diff.patch').write_text(git('diff',f'{p["base"]["sha"]}...{p["head"]["sha"]}'))
            files=git('diff','--name-only',f'{p["base"]["sha"]}...{p["head"]["sha"]}').splitlines()
            (folder/'files.json').write_text(json.dumps(files,indent=2))
            for f in files:
              if not f.endswith(('.ts','.tsx','.md','.yml','.json','.css')):continue
              for ref,label in [(p['head']['sha'],'head'),(main,'main')]:
                dest=folder/label/f;dest.parent.mkdir(parents=True,exist_ok=True)
                data=subprocess.run(['git','show',f'{ref}:{f}'],capture_output=True)
                if data.returncode==0:dest.write_bytes(data.stdout)
          hashes={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          (root/'SHA256SUMS.json').write_text(json.dumps(hashes,indent=2))
          print(json.dumps({'candidate_batch':len(selected),'unique_branches_accounted_for':len(unique),'protected_baseline':len(protected)}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backlog-resolution-evidence
          path: resolution-evidence/
          if-no-files-found: error
          retention-days: 90
