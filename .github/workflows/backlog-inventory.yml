name: backlog inventory

on:
  schedule:
    - cron: '17 16 * * 1'
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      cutoff:
        description: 'Optional UTC cutoff; existing active-work exclusions always remain protected.'
        required: false
        type: string
  pull_request:
    paths:
      - '.github/backlog*.json'
      - '.github/scripts/backlog*'
      - '.github/workflows/backlog*'

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: backlog-inventory-${{ github.event.pull_request.number || 'scheduled' }}
  cancel-in-progress: false

jobs:
  inventory:
    if: github.event.schedule != '23 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test inventory, persistent protection and 12-hour review rules
        run: node --test .github/scripts/backlog.test.mjs .github/scripts/backlog-review.test.mjs
      - name: Read branches and all PR history
        env:
          GH_TOKEN: ${{ github.token }}
          BACKLOG_CUTOFF: ${{ github.event_name == 'pull_request' && '2026-10-09T18:04:00Z' || inputs.cutoff || '' }}
        run: node .github/scripts/backlog.mjs inventory
      - name: Add persistent exclusions, finite batch gates and branch evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/backlog-review.mjs enrich
      - name: Retain full evidence, not just the summary
        uses: actions/upload-artifact@v4
        with:
          name: backlog-inventory
          path: backlog-output/
          if-no-files-found: error
          retention-days: 90
  dashboard:
    needs: inventory
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: backlog-inventory
          path: backlog-output
      - name: Refresh only the existing control issue's report section
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/backlog-review.mjs publish
  age-review:
    if: github.event_name == 'schedule' && github.event.schedule == '23 * * * *' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test review and preservation rules
        run: node --test .github/scripts/backlog-review.test.mjs
      - name: Refresh 12-hour review section; no per-PR comments or destructive actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/backlog-review.mjs age
  pdf-evidence:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 987
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '7f752798b3f6bb548f500d07bac3b034128c9211'
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the reviewed branch's locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Retain the existing renderer test's exact output and inputs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/hamilton/reports/StoryExhibitPdf.test.tsx')
          text = p.read_text()
          needle = '    expect(buffer.subarray(0, 4).toString()).toBe("%PDF");'
          assert text.count(needle) == 1, 'Pinned test changed; do not guess an insertion point'
          capture = '''    evidenceFs.mkdirSync("pdf-review-output", { recursive: true });
              evidenceFs.writeFileSync("pdf-review-output/pr-810-fixture.pdf", buffer);
              evidenceFs.writeFileSync("pdf-review-output/pr-810-input.json", JSON.stringify({
                pr: 810, head: "7f752798b3f6bb548f500d07bac3b034128c9211", syntheticFixture: true,
                analysis, story,
                duplicateSourceProbe: sourceLine([{ label: "Same label", asOf: "2025-01-01" }, { label: "Same label", asOf: "2026-01-01" }]),
              }, null, 2));
          '''
          p.write_text('import * as evidenceFs from "node:fs";\n' + text.replace(needle, capture + needle))
          PY
      - name: Run the original PDF tests with evidence capture only
        run: ./node_modules/.bin/vitest run src/components/hamilton/reports/StoryExhibitPdf.test.tsx --reporter=verbose
      - name: Upload synthetic PDF and its exact underlying input
        uses: actions/upload-artifact@v4
        with:
          name: backlog-pr-810-pdf-evidence
          path: pdf-review-output/
          if-no-files-found: error
          retention-days: 90
