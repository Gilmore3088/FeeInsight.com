name: fee-audience-repair-workspace

on:
  push:
    branches: [fix/pinnacle-fee-audience-integrity]
    paths: [.github/workflows/fee-audience-repair-workspace.yml]

permissions:
  contents: read

jobs:
  migration-scaffolds:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Create migration files without connecting to a database
        run: |
          npx --yes supabase@2.120.0 --version
          npx --yes supabase@2.120.0 --help
          npx --yes supabase@2.120.0 migration --help
          npx --yes supabase@2.120.0 migration new --help
          npx --yes supabase@2.120.0 migration new fee_audience_integrity
          npx --yes supabase@2.120.0 migration new pinnacle_audience_correction
          mkdir /tmp/feeinsight-migration-scaffolds
          cp supabase/migrations/*_fee_audience_integrity.sql /tmp/feeinsight-migration-scaffolds/
          cp supabase/migrations/*_pinnacle_audience_correction.sql /tmp/feeinsight-migration-scaffolds/
      - uses: actions/upload-artifact@v4
        with:
          name: feeinsight-migration-scaffolds
          path: /tmp/feeinsight-migration-scaffolds/
          retention-days: 1
