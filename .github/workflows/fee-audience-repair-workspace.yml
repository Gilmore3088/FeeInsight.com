name: fee-audience-repair-workspace

on:
  push:
    branches: [fix/pinnacle-fee-audience-integrity]
    paths: [.github/workflows/fee-audience-repair-workspace.yml]

permissions:
  contents: read

jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive only tracked source (no credentials or production data)
        run: git archive --format=tar.gz HEAD > /tmp/feeinsight-repair-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: feeinsight-repair-source
          path: /tmp/feeinsight-repair-source.tar.gz
          retention-days: 1
