name: fee-audience-repair-workspace

on:
  push:
    branches: [fix/pinnacle-fee-audience-integrity]
    paths: [.github/workflows/fee-audience-repair-workspace.yml]

permissions:
  contents: read

jobs:
  test-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked test dependencies without production credentials
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Package offline test dependencies
        run: tar -czf /tmp/feeinsight-repair-dependencies.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: feeinsight-repair-dependencies
          path: /tmp/feeinsight-repair-dependencies.tar.gz
          retention-days: 1
