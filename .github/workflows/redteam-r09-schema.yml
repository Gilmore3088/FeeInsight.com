name: Verify R09 pipeline schema error gate
on:
  push:
    branches: [redteam/r09-ci-validation]
    paths: [.github/redteam/r09-schema.patch.gz, .github/workflows/redteam-r09-schema.yml]
permissions:
  contents: write
concurrency:
  group: redteam-r09-schema
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'Gilmore3088/FeeInsight.com' && github.ref == 'refs/heads/redteam/r09-ci-validation'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Save the stale fixture and apply the exact reviewed test patch
        run: |
          set -euo pipefail
          git show HEAD:tests/e2e/production-schema.sql > "$RUNNER_TEMP/stale-schema.sql"
          echo 'f77ec118f6de9d8bef4b307c837d80d5ad12fa7c1ed66fd2910245765f318e0b  .github/redteam/r09-schema.patch.gz' | sha256sum --check
          gzip -dc .github/redteam/r09-schema.patch.gz > "$RUNNER_TEMP/schema.patch"
          echo "4633624f0c693fb4a9ee25127f293a0e586a752c2dd39a11c96f9816c3759d75  $RUNNER_TEMP/schema.patch" | sha256sum --check
          git apply --index "$RUNNER_TEMP/schema.patch"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run validate
      - name: Prove stale schema fails and aligned schema passes in separate disposable databases
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          sudo systemctl start postgresql.service
          sudo -u postgres psql -q -c "ALTER USER postgres PASSWORD 'postgres'"
          sudo -u postgres createdb e2e_stale
          sudo -u postgres createdb e2e_aligned
          psql -h localhost -U postgres -d e2e_stale -q -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/stale-schema.sql"
          psql -h localhost -U postgres -d e2e_aligned -q -v ON_ERROR_STOP=1 -f tests/e2e/production-schema.sql
          if E2E_DATABASE_URL=postgres://postgres:postgres@localhost:5432/e2e_stale npm run test:pipeline > "$RUNNER_TEMP/negative.log" 2>&1; then
            echo 'The stale fixture incorrectly passed the schema-error guard.'
            exit 1
          fi
          grep -q 'The pipeline logged missing database objects' "$RUNNER_TEMP/negative.log"
          echo 'Negative control failed for the intended missing-schema assertion.'
          E2E_DATABASE_URL=postgres://postgres:postgres@localhost:5432/e2e_aligned npm run test:pipeline
      - run: npm run build
      - name: Commit the verified test-only change and remove delivery scaffold
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'redteam/r09-ci-validation'
          remote=$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)
          test "$remote" = "$GITHUB_SHA"
          git rm .github/redteam/r09-schema.patch.gz .github/workflows/redteam-r09-schema.yml
          test "$(git write-tree)" = 'de9badf2925554d36a2dbdb3039f69f1770be879'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(pipeline): reject missing schema objects and align the disposable fixture (#983)'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          echo 'Stale-schema negative control and aligned pipeline passed as intended. No runtime code or production database changed.' >> "$GITHUB_STEP_SUMMARY"
