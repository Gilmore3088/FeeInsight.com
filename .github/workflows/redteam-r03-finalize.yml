name: Verify and deliver R03 durable payment delivery
on:
  push:
    branches: [redteam/r03-payment-delivery-outbox]
    paths: [.github/redteam/r03.patch.gz, .github/workflows/redteam-r03-finalize.yml]
permissions:
  contents: write
concurrency:
  group: redteam-r03-finalize
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'Gilmore3088/FeeInsight.com' && github.ref == 'refs/heads/redteam/r03-payment-delivery-outbox'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply the exact reviewed recovery patch
        run: |
          set -euo pipefail
          echo '4e8f7288811b4cc20abf89bf12c45f3bb2511d13dd8258dbc74851ea7e017904  .github/redteam/r03.patch.gz' | sha256sum --check
          gzip -dc .github/redteam/r03.patch.gz > "$RUNNER_TEMP/r03.patch"
          echo "37044d57dc34e1bfe1e6a316d19efb6812d686d5223b7d3de9585d86a4c6d85e  $RUNNER_TEMP/r03.patch" | sha256sum --check
          git apply --index "$RUNNER_TEMP/r03.patch"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run guard:legacy
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npx vitest run --maxWorkers=2
      - name: Verify checkout and interrupted fulfillment against disposable PostgreSQL
        env:
          BILLING_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/feeinsight_billing_test
          PAYMENT_DELIVERY_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/feeinsight_billing_test_outbox
        run: |
          set -euo pipefail
          sudo systemctl start postgresql.service
          sudo -u postgres psql -q -c "ALTER USER postgres PASSWORD 'postgres'"
          sudo -u postgres createdb feeinsight_billing_test
          sudo -u postgres createdb feeinsight_billing_test_outbox
          npx vitest run src/lib/billing/checkout.integration.test.ts src/lib/billing/payment-delivery.integration.test.ts --maxWorkers=1
      - run: npm run build
      - name: Commit only the verified recovery tree to its existing branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'redteam/r03-payment-delivery-outbox'
          remote=$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)
          test "$remote" = "$GITHUB_SHA"
          git rm .github/redteam/r03.patch.gz .github/workflows/redteam-r03-finalize.yml
          test "$(git write-tree)" = '3adf91efb38603d62aab2d45b5122895821b1e9c'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(payments): persist fulfillment obligations and recover interrupted delivery (#983)'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          echo 'Exact recovery tree delivered; temporary workflow removed. Provider doubles only; migrations and live services remain unmodified.' >> "$GITHUB_STEP_SUMMARY"
