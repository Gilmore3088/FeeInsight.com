name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Guard retired execution surfaces
        run: npm run guard:legacy
      - name: Run focused agentic tests
        run: npm run test:agentic
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Run full test suite
        run: npx vitest run
