name: tests

# Runs on pull requests and on every push to main (James, 2026-10-14): a PR run tests the PR's
# head, and the main run tests the exact merge commit, since main can move after a PR's last run.
# Docs-only changes skip it. A newer push to the same PR cancels the older run; main runs are never
# cancelled, so every merge commit gets its own result.
#
# Every test runs once (James, 2026-10-14: no test bloat). The jobs run side by side: checks, the
# unit suite in two shards, Knox's answer-key gates (the slowest files, on their own), and the
# end-to-end run on a real database. `app-tests` is the check branch protection and the merge rule
# read; it passes only when every job above it passed.
#
# A pull request always runs, so `app-tests` always reports and can be a required check (#982 B8);
# when the PR changes only Markdown and docs/, the `changes` job skips the test jobs and
# `app-tests` passes on its own.
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: tests-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Run by the knox-gates job; the unit shards leave them out.
  KNOX_GATES: src/lib/agents/knox/answer-key-gate.test.ts src/lib/agents/knox/state-answer-key-gate.test.ts
  # Run by the e2e job against a real database; the unit shards leave them out.
  E2E_TESTS: src/lib/data-store/live-source-audit.db.test.ts src/lib/agents/magellan/registry/failure.db.test.ts src/lib/agents/state-lane-budget.db.test.ts src/lib/agents/knox/takedown-lessons.db.test.ts src/lib/data-store/segment-stated-prices.db.test.ts src/lib/agents/scoreboard-execution.db.test.ts src/lib/data-store/answer-key-eligibility.db.test.ts src/lib/auth-password-lifecycle.db.test.ts src/lib/api-hardening/login-rate-limit.db.test.ts src/lib/agents/pipeline.e2e.test.ts src/lib/data-store/hamilton-peer-list.db.test.ts src/lib/data-store/pro-accounts.db.test.ts src/lib/agents/knox/reread.db.test.ts src/lib/agents/knox/wrapped-fee-bullets.db.test.ts src/lib/agents/knox/wire-clause-prices.db.test.ts src/lib/agents/hamilton/refresh-copy.db.test.ts src/lib/agents/hamilton/newer-copy-retire.db.test.ts src/lib/agents/hamilton/exact-duplicate.db.test.ts src/lib/agents/deming/playbook-contradictions.db.test.ts src/lib/agents/deming/knox-misses.db.test.ts src/lib/agents/deming/accuracy-history.db.test.ts src/lib/fee-corrections.db.test.ts src/lib/data-catalog/query-data.db.test.ts src/lib/data-catalog/roll-ups.db.test.ts src/lib/data-catalog/ncua-discovery.db.test.ts src/lib/hamilton/customer-isolation.db.test.ts src/lib/agents/knox/ancillary-product-ownership.db.test.ts src/lib/agents/knox/monthly-account-owners.db.test.ts src/lib/agents/knox/monthly-account-owner-concurrency.db.test.ts src/lib/provider-usage-accounting.db.test.ts src/lib/agents/rosetta/pdf-stacked-repair.db.test.ts src/lib/public-read-budget.db.test.ts

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Does this change anything but Markdown and docs/?
        id: diff
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          changed=$(git diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" | grep -v -E '\.md$|^docs/' || true)
          if [ -n "$changed" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; else echo "code=false" >> "$GITHUB_OUTPUT"; fi
          echo "Changed outside Markdown and docs/:"; echo "${changed:-(nothing)}"
      # A findings-only PR skips `checks`, so the one guard that reads docs/ runs here (#1108).
      - name: New findings name their guard
        if: steps.diff.outputs.code == 'false'
        run: bash scripts/ci-guards.sh findings-file-kill

  checks:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Guard retired execution surfaces
        run: npm run guard:legacy
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint

  unit:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Fee-quality gates first (hard documents, taxonomy, category guard, confirmed takedowns)
        # #1067: real source lines every taxonomy, fold, guard or same-line change must still read
        # the same way. Shard 1 runs them first so a quality break fails fast; the shard runs leave them out.
        if: matrix.shard == 1
        run: npm run test:quality-gates
      - name: Record the peer-list sources under test
        if: matrix.shard == 1
        run: |
          git rev-parse HEAD
          git hash-object src/components/hamilton/analyze/PeerListView.tsx src/components/hamilton/analyze/PeerAwareStructuredAsk.tsx src/components/hamilton/analyze/PeerAwareStructuredAsk.test.tsx
      - name: Unit tests (shard ${{ matrix.shard }} of 2)
        run: |
          excludes=""
          for file in $KNOX_GATES $E2E_TESTS src/lib/agents/deming/hard-documents.test.ts src/lib/agents/deming/regression-gate.test.ts src/lib/fee-category-guard.test.ts src/lib/fee-taxonomy.test.ts src/lib/fee-fold.test.ts; do
            excludes="$excludes --exclude $file"
          done
          npx vitest run --shard=${{ matrix.shard }}/2 $excludes

  knox-gates:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Knox answer-key gates (Texas and seven states)
        run: npx vitest run $KNOX_GATES

  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: End-to-end pipeline test
        # One real state-lane run against the production schema in a throwaway database.
        # The runner's PostgreSQL has SSL on, which the app's connection requires.
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -q -c "ALTER USER postgres PASSWORD 'postgres'"
          sudo -u postgres createdb e2e
          PGPASSWORD=postgres psql -h localhost -U postgres -d e2e -q -v ON_ERROR_STOP=1 -f tests/e2e/production-schema.sql
          E2E_DATABASE_URL=postgres://postgres:postgres@localhost:5432/e2e npx vitest run $E2E_TESTS

  app-tests:
    # The one required check: green only when every job above passed.
    if: always()
    needs: [changes, checks, unit, knox-gates, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        run: |
          echo "changes=${{ needs.changes.result }} code=${{ needs.changes.outputs.code }} checks=${{ needs.checks.result }} unit=${{ needs.unit.result }} knox-gates=${{ needs.knox-gates.result }} e2e=${{ needs.e2e.result }}"
          test "${{ needs.changes.result }}" = success
          if [ "${{ needs.changes.outputs.code }}" = false ]; then echo "Markdown and docs/ only: no tests to run."; exit 0; fi
          test "${{ needs.checks.result }}" = success
          test "${{ needs.unit.result }}" = success
          test "${{ needs.knox-gates.result }}" = success
          test "${{ needs.e2e.result }}" = success

  fee-audience-sql:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate audience migrations in an isolated PostgreSQL database
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -q -c "ALTER USER postgres PASSWORD 'postgres'"
          sudo -u postgres createdb fee_audience_test
          PGPASSWORD=postgres psql -h localhost -U postgres -d fee_audience_test -q -v ON_ERROR_STOP=1 -f tests/e2e/production-schema.sql
          PGPASSWORD=postgres psql -h localhost -U postgres -d fee_audience_test -q -v ON_ERROR_STOP=1 -f tests/e2e/fee-audience.sql
