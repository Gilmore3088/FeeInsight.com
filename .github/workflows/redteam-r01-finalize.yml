name: Verify and commit R01 security dependencies
on:
  push:
    branches: [redteam/r01-security-dependencies]
    paths: [.github/workflows/redteam-r01-finalize.yml]
permissions:
  contents: write
concurrency:
  group: redteam-r01-finalize
  cancel-in-progress: false
jobs:
  update-and-verify:
    if: github.repository == 'Gilmore3088/FeeInsight.com' && github.ref == 'refs/heads/redteam/r01-security-dependencies'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply scoped compatible dependency updates
        run: |
          npm install --ignore-scripts --no-audit --no-fund --save-exact next@16.4.0 react@19.3.0 react-dom@19.3.0
          npm install --ignore-scripts --no-audit --no-fund --save-dev --save-exact eslint-config-next@16.4.0
          npm update --ignore-scripts --no-audit --no-fund fast-xml-builder source-map-js fast-xml-parser @aws-sdk/xml-builder baseline-browser-mapping sanitize-html
      - name: Reinstall exact final lockfile without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run guard:legacy
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npx vitest run --maxWorkers=2
      - run: npm run build
      - name: Commit verified dependency files to their existing branch only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'redteam/r01-security-dependencies'
          remote=$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)
          test "$remote" = "$GITHUB_SHA"
          git add package.json package-lock.json
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(security): patch framework and vulnerable compatible dependencies'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          echo 'Dependency fix committed after high-severity audit, full tests, and build. Lower-severity advisory follow-up is documented.' >> "$GITHUB_STEP_SUMMARY"
