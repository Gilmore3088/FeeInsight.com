name: Verify and commit R09 validation entry points
on:
  push:
    branches: [redteam/r09-ci-validation]
    paths: [.github/redteam/r09-apply.py, .github/workflows/redteam-r09-finalize.yml]
permissions:
  contents: write
concurrency:
  group: redteam-r09-finalize
  cancel-in-progress: false
jobs:
  apply-and-verify:
    if: github.repository == 'Gilmore3088/FeeInsight.com' && github.ref == 'refs/heads/redteam/r09-ci-validation'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: python3 .github/redteam/r09-apply.py
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run validate
      - run: npm run build
      - name: Verify real pipeline in disposable CI PostgreSQL
        env:
          E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/e2e
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          sudo systemctl start postgresql.service
          sudo -u postgres psql -q -c "ALTER USER postgres PASSWORD 'postgres'"
          sudo -u postgres createdb e2e
          psql -h localhost -U postgres -d e2e -q -v ON_ERROR_STOP=1 -f tests/e2e/production-schema.sql
          npm run test:pipeline
      - name: Commit verified package commands to their existing branch only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'redteam/r09-ci-validation'
          remote=$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)
          test "$remote" = "$GITHUB_SHA"
          git add package.json
          test "$(git diff --cached --name-only)" = 'package.json'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor(ci): expose one full validation command and explicit integration checks'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          echo 'Validation commands committed after full suite, production build, and disposable PostgreSQL pipeline tests.' >> "$GITHUB_STEP_SUMMARY"
