name: apply-tested-fee-audience-repair

on:
  push:
    branches: [fix/pinnacle-fee-audience-integrity]
    paths:
      - .github/repair-workspace/changes.mbox.xz.b64
      - .github/workflows/fee-audience-apply-patch.yml

permissions:
  contents: write

jobs:
  apply-tested-commits:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Validate the exact tested patch and apply only to the repair branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'fix/pinnacle-fee-audience-integrity'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import base64, hashlib, lzma, pathlib
          encoded = pathlib.Path('.github/repair-workspace/changes.mbox.xz.b64').read_text().strip()
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          expected = '9fc209963319524d7a474aa5cdb8cee7964c24003cf8b57bcb4eb85ee2f97d78'
          assert hashlib.sha256(patch).hexdigest() == expected, 'Patch checksum mismatch'
          for line in patch.decode().splitlines():
              if line.startswith('+++ b/'):
                  path = line[6:]
                  assert path.startswith(('src/', 'supabase/migrations/', 'tests/e2e/', 'docs/project/findings/')) or path == '.github/workflows/test.yml', path
          pathlib.Path('/tmp/fee-audience-repair.mbox').write_bytes(patch)
          PY
          git config user.name 'FeeInsight Repair'
          git config user.email '35467558+Gilmore3088@users.noreply.github.com'
          # Workflow changes were applied separately using the authorized GitHub connector.
          # This job's token only needs source-write permission, not workflow permission.
          git am --3way --exclude=.github/workflows/test.yml /tmp/fee-audience-repair.mbox
          git rm .github/repair-workspace/changes.mbox.xz.b64
          git commit -m 'chore: remove temporary repair payload'
          test -z "$(git diff --name-only "$GITHUB_SHA" HEAD -- .github/workflows/)"
          git push origin HEAD:refs/heads/fix/pinnacle-fee-audience-integrity
          git log -6 --oneline
