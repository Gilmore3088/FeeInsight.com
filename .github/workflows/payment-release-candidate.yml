# trigger: canonical-payment-release-candidate-v3
name: payment release-candidate verification
on:
  push:
    branches: [redteam/r03-payment-delivery-outbox]
    paths: [.github/workflows/payment-release-candidate.yml]

permissions:
  contents: read

jobs:
  verify-payment-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PGPASSWORD: postgres
      BILLING_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/feeinsight_billing_test
      PAYMENT_DELIVERY_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/feeinsight_billing_test_outbox
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Prove canonical migration filenames
        run: |
          set -euo pipefail
          test -f supabase/migrations/20270110000040_fee_audience_integrity.sql
          test -f supabase/migrations/20270110000041_pinnacle_audience_correction.sql
          test -f supabase/migrations/20270110000042_pro_checkout_intents.sql
          test -f supabase/migrations/20270110000043_payment_email_outbox.sql
          test ! -e supabase/migrations/20270110000040_pro_checkout_intents.sql
          test ! -e supabase/migrations/20270110000041_payment_email_outbox.sql
      - name: Start disposable PostgreSQL
        run: |
          set -euo pipefail
          sudo systemctl start postgresql.service
          sudo -u postgres psql -v ON_ERROR_STOP=1 <<'SQL'
          ALTER USER postgres PASSWORD 'postgres';
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname='anon') THEN CREATE ROLE anon; END IF;
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname='authenticated') THEN CREATE ROLE authenticated; END IF;
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname='service_role') THEN CREATE ROLE service_role BYPASSRLS; END IF;
          END $$;
          SQL
          sudo -u postgres createdb payment_release
          sudo -u postgres createdb feeinsight_billing_test
          sudo -u postgres createdb feeinsight_billing_test_outbox
      - name: Load current production-schema snapshot and assert Pinnacle 40 is baked in
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U postgres -d payment_release -v ON_ERROR_STOP=1 -f tests/e2e/production-schema.sql
          psql -h 127.0.0.1 -U postgres -d payment_release -v ON_ERROR_STOP=1 <<'SQL'
          DO $
          BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_schema='public' AND table_name='raw_fee_observations' AND column_name='fee_audience'
            ) THEN RAISE EXCEPTION 'Pinnacle migration 40 schema is not present in production snapshot'; END IF;
            IF NOT EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_schema='public' AND table_name='verified_fee_observations' AND column_name='fee_audience'
            ) THEN RAISE EXCEPTION 'verified fee audience column missing'; END IF;
            IF NOT EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_schema='public' AND table_name='published_fee_records' AND column_name='fee_audience'
            ) THEN RAISE EXCEPTION 'published fee audience column missing'; END IF;
          END $;
          SQL
      - name: Apply Pinnacle correction 41 then payment 42 → 43
        run: |
          set -euo pipefail
          for file in \
            supabase/migrations/20270110000041_pinnacle_audience_correction.sql \
            supabase/migrations/20270110000042_pro_checkout_intents.sql \
            supabase/migrations/20270110000043_payment_email_outbox.sql
          do
            echo "Applying $file"
            psql -h 127.0.0.1 -U postgres -d payment_release -v ON_ERROR_STOP=1 -f "$file"
          done
      - name: Assert payment schema and access controls
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U postgres -d payment_release -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF to_regclass('public.pro_checkout_intents') IS NULL THEN
              RAISE EXCEPTION 'pro_checkout_intents missing';
            END IF;
            IF to_regclass('public.payment_email_outbox') IS NULL THEN
              RAISE EXCEPTION 'payment_email_outbox missing';
            END IF;
            IF NOT (SELECT relrowsecurity FROM pg_class WHERE oid='public.pro_checkout_intents'::regclass) THEN
              RAISE EXCEPTION 'checkout intents RLS disabled';
            END IF;
            IF NOT (SELECT relrowsecurity FROM pg_class WHERE oid='public.payment_email_outbox'::regclass) THEN
              RAISE EXCEPTION 'payment outbox RLS disabled';
            END IF;
            IF has_table_privilege('anon','public.pro_checkout_intents','SELECT')
              OR has_table_privilege('authenticated','public.pro_checkout_intents','SELECT')
              OR has_table_privilege('anon','public.payment_email_outbox','SELECT')
              OR has_table_privilege('authenticated','public.payment_email_outbox','SELECT') THEN
              RAISE EXCEPTION 'client role can read private payment tables';
            END IF;
            IF NOT has_table_privilege('service_role','public.pro_checkout_intents','SELECT,INSERT,UPDATE') THEN
              RAISE EXCEPTION 'service_role checkout privileges missing';
            END IF;
            IF NOT has_table_privilege('service_role','public.payment_email_outbox','SELECT,INSERT,UPDATE') THEN
              RAISE EXCEPTION 'service_role outbox privileges missing';
            END IF;
            IF to_regclass('public.pro_checkout_one_current_per_user') IS NULL THEN
              RAISE EXCEPTION 'checkout uniqueness index missing';
            END IF;
            IF to_regclass('public.payment_email_due') IS NULL OR to_regclass('public.payment_email_event') IS NULL THEN
              RAISE EXCEPTION 'outbox indexes missing';
            END IF;
          END $$;
          SQL
      - name: Install and execute payment integration tests
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npx vitest run \
            src/lib/billing/checkout.integration.test.ts \
            src/lib/billing/payment-delivery.integration.test.ts \
            --maxWorkers=1
      - name: Payment release-candidate summary
        run: |
          echo 'Current production-schema snapshot contains Pinnacle 40; Pinnacle 41 then payment 42→43 applied cleanly; 17 payment PostgreSQL integration tests passed.' >> "$GITHUB_STEP_SUMMARY"
          echo 'This verifies disposable PostgreSQL only; it does not migrate production or contact Stripe/Resend.' >> "$GITHUB_STEP_SUMMARY"
