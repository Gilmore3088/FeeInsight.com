name: Verify R08 legacy cleanup
on:
  push:
    branches: [redteam/r08-legacy-cleanup]
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'Gilmore3088/FeeInsight.com' && github.ref == 'refs/heads/redteam/r08-legacy-cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run guard:legacy
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npx vitest run --maxWorkers=2
      - run: npm run build
